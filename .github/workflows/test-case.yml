name: maluku-test-case

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      exact:
        description: "Solve the Maluku exact MILP on HiGHS and compare with the reference (slow on CI runners)"
        type: boolean
        default: false

concurrency:
  # keyed by event too, so a push does not cancel a manually dispatched exact run
  group: test-case-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Julia environment, preflight and result scripts (no solve)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Bootstrap the pinned Julia environment
        run: julia bootstrap.jl
      - name: Preflight the test config (validates config, inputs and HiGHS)
        run: julia --project=. run_model.jl --config test_case/maluku/config.json --preflight-only
      - name: Result scripts on the shipped reference outputs
        run: |
          julia --project=. scripts/summarize_results.jl test_case/maluku/expected_results
          julia --project=. scripts/compare_results.jl test_case/maluku/expected_results test_case/maluku/expected_results

  job-generators:
    name: Python job generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate the Maluku job folder (no submission, no solve)
        run: |
          python generate_jobs.py --scenarios-file scenario_maluku_test.yml --output-root /tmp/jobs
          cat /tmp/jobs/base_maluku_2030_reference/config.json
          python generate_jobs.py --scenarios-file scenario_2030_example.yml --output-root /tmp/jobs_full | tail -1

  exact:
    name: Maluku exact MILP (HiGHS, full solve)
    if: github.event_name == 'workflow_dispatch' && inputs.exact
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - run: julia bootstrap.jl
      - run: julia --project=. test_case/run_maluku_test.jl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maluku-exact-results
          path: results/
